name: Build Stock Plugin

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Stock Plugin (${{ matrix.platform }})
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            output_dir: bin\x64\Release
            pkg_name: Stock_x64
          - platform: Win32
            output_dir: bin\Release
            pkg_name: Stock_x86

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0, 18.0)'

      - name: Build utilities (${{ matrix.platform }})
        shell: cmd
        run: |
          msbuild utilities\utilities.vcxproj /p:Configuration=Release /p:Platform=${{ matrix.platform }} /p:SolutionDir="${{ github.workspace }}/" > utilities_build.log 2>&1
          if %ERRORLEVEL% NEQ 0 (
            type utilities_build.log
            exit /b 1
          )

      - name: Build Stock (${{ matrix.platform }})
        shell: cmd
        run: |
          msbuild Plugins\Stock\Stock.vcxproj /p:Configuration=Release /p:Platform=${{ matrix.platform }} /p:SolutionDir="${{ github.workspace }}/" > stock_build.log 2>&1
          if %ERRORLEVEL% NEQ 0 (
            type stock_build.log
            exit /b 1
          )

      - name: Package ${{ matrix.pkg_name }}
        shell: pwsh
        run: |
          $dist = "dist\${{ matrix.pkg_name }}"
          New-Item -ItemType Directory -Force -Path $dist
          
          # 拷贝编译生成的 Stock.dll
          if (Test-Path "${{ matrix.output_dir }}\Stock.dll") {
              Copy-Item "${{ matrix.output_dir }}\Stock.dll" -Destination "$dist\" -Force
          } else {
              Get-ChildItem -Path "bin" -Filter "Stock.dll" -Recurse | Copy-Item -Destination "$dist\" -Force
          }
          
          # 打包为 zip
          Compress-Archive -Path "$dist\*" -DestinationPath "${{ matrix.pkg_name }}.zip" -Force

      - name: Upload ${{ matrix.pkg_name }} Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pkg_name }}
          path: ${{ matrix.pkg_name }}.zip
          retention-days: 30
