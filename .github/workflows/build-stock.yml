name: Build Stock Plugin

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Stock Plugin (x64)
    runs-on: windows-2022

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0, 18.0)'

      - name: Build utilities (x64)
        shell: cmd
        run: msbuild utilities\utilities.vcxproj /p:Configuration=Release /p:Platform=x64 /p:SolutionDir="${{ github.workspace }}/"

      - name: Build Stock (x64)
        shell: cmd
        run: msbuild Plugins\Stock\Stock.vcxproj /p:Configuration=Release /p:Platform=x64 /p:SolutionDir="${{ github.workspace }}/"

      - name: Package Stock_x64
        shell: pwsh
        run: |
          $dist = "dist\Stock_x64"
          New-Item -ItemType Directory -Force -Path $dist
          
          # 拷贝编译生成的 Stock.dll
          if (Test-Path "bin\x64\Release\Stock.dll") {
              Copy-Item "bin\x64\Release\Stock.dll" -Destination "$dist\" -Force
          } else {
              Get-ChildItem -Path "bin" -Filter "Stock.dll" -Recurse | Copy-Item -Destination "$dist\" -Force
          }
          
          # 打包为 zip
          Compress-Archive -Path "$dist\*" -DestinationPath "Stock_x64.zip" -Force

      - name: Upload Stock_x64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stock_x64
          path: Stock_x64.zip
          retention-days: 30

      - name: Update Latest Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-stock
          name: Stock Plugin Latest Build (x64)
          body: Auto-generated build from GitHub Actions for fast local sync.
          files: |
            Stock_x64.zip
            dist/Stock_x64/Stock.dll
          prerelease: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
